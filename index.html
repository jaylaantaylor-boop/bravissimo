  $("#s-dialects .wrap").innerHTML='<button class="btn ghost sm" onclick="S.ui_dial=null;renderDialects()">← All dialects</button><h1 style="margin-top:12px">📒 Parole di famiglia</h1><div class="muted">The family notebook — the words your girlfriend\'s family actually use</div>'+
  '<div class="card tip"><p>Every village in the Val Sarmento says things its own way, and almost none of it is written down. So this notebook is the real dictionary of Noepoli: when Nonna says something, write it here exactly the way it sounds, add what it means, and tap <b>Record</b> to keep her voice saying it. Once you have four or more, the <b>Quiz</b> turns them into exercises.</p><p class="small muted">Recordings stay in this browser and are not included in the backup code (they\'d be too big). Phrases are.</p></div>'+
  '<div class="card"><h3 style="margin-top:0">Add a phrase</h3>'+famForm()+'<button class="btn wide" onclick="famAdd()">Add to notebook</button></div>'+
  (F.length?'<div class="row" style="margin:8px 0"><b class="grow">'+F.length+" phrase"+(F.length===1?"":"s")+'</b><button class="btn sm gold" onclick="famQuiz()">🎮 Quiz me</button></div>':'<p class="muted center">Nothing here yet. Ask the family for a first word — “how do you say hello?” is a good start.</p>')+

{id:"treno",lvl:"A2",title:"Il treno per Venezia",icon:"🚆",text:"Marco arriva alla stazione di Bologna alle otto meno dieci. Il treno per Venezia parte alle otto e cinque dal binario sette. Compra il biglietto alla macchinetta, lo convalida e corre. Sul treno trova un posto vicino al finestrino. Accanto a lui c'è una ragazza con una chitarra. «Vai a Venezia anche tu?» chiede Marco. «Sì, suono in un piccolo teatro stasera,» risponde lei. Si chiama Giulia, è di Verona. Parlano per tutto il viaggio: di musica, di cibo, della nebbia che copre i campi. Quando il treno arriva a Venezia Santa Lucia, Giulia dice: «Vieni al concerto, se vuoi. Inizia alle nove.» Marco sorride. Aveva un altro programma, ma adesso ha un programma migliore.",

{id:"noepoli",lvl:"B1",title:"Dicembre a Noepoli",icon:"🍷",text:"È l'otto dicembre e a Noepoli fa freddo. Le montagne del Pollino sono bianche di neve. Nella cantina di zio Vito ci sono dieci uomini intorno a un tavolo di legno. Oggi è il giorno della spillatura: si apre la botte e si assaggia il vino nuovo. Zio Vito riempie il primo bicchiere, lo alza e dice in dialetto: «Stu bëcchjir' i vin' jè bell' e fin', brindës fazz' allu patrun' i sta candin'!» Tutti ridono e gridano «Salut'!» Sul tavolo ci sono salsicce, biscotti secchi e peperoni sotto olio. Mia nonna, dalla porta, controlla che nessuno esageri. Fra cinque giorni, per Santa Lucia, cucinerà la cuccìa nella pignatta di terracotta, come faceva sua madre. «Le tradizioni,» dice sempre, «sono la memoria di un paese.» Poi mi passa un bicchiere piccolo, piccolissimo. «Solo un dito. Sei ancora giovane.»",

{id:"telefonata",lvl:"B1",title:"Una telefonata con la famiglia",icon:"📞",text:"«Pronto?» «Pronto, zia Carmela! Sono io.» «Tesoro mio! Come stai? Mangi abbastanza?» «Sì, zia, mangio benissimo. Ti chiamo perché ho una notizia: a giugno vengo in Italia. Vorrei venire a Noepoli.» Dall'altra parte del telefono c'è un silenzio, poi un grido. «Vito! Vito! Viene a giugno!» Lo zio prende il telefono. «Se vieni a giugno ti porto sul Pollino, e poi facciamo la salsiccia insieme. Sai fare la salsiccia?» «No, zio, ma imparo in fretta.» «Bene. E porta la tua ragazza, che la nonna vuole conoscerla. Le ha già comprato un regalo.» «Ma non sa ancora se viene!» «Non importa. La nonna sa sempre tutto prima di tutti.» Rido. Dopo la telefonata guardo il calendario: mancano cento giorni. Devo studiare l'italiano ogni sera, altrimenti la nonna mi parla e io capisco solo «mangia».",

function openStory(id){const st=STORIES.find(x=>x.id===id);L={mode:"flash",ex:[],i:0,fb:false};openRunner();$("#act").style.display="none";$("#lhearts").textContent="";$("#lprog").style.width="30%";
  const keys=Object.keys(st.gloss).sort((a,b)=>b.length-a.length);let html=esc(st.text);keys.forEach((k,i)=>{const re=new RegExp("(^|[^\\wàèéìòù])("+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")(?=[^\\wàèéìòù]|$)","i");html=html.replace(re,(m,pre,w)=>pre+'<span class="w" data-g="'+i+'">'+w+"</span>")});
  $("#exbox").innerHTML='<span class="pill">Story · '+st.lvl+'</span><h2>'+st.icon+" "+esc(st.title)+'</h2><div class="row" style="margin-bottom:8px"><button class="spk" data-say="'+esc(st.text)+'">🔊</button><span class="muted small">Listen to the whole story · tap underlined words</span></div><div class="story"><p id="stext">'+html+'</p></div><div class="gloss" id="gloss"></div><button class="btn wide" onclick="storyQuiz(\''+id+'\')">Ho capito → Domande</button>';
  $("#stext").onclick=ev=>{const w=ev.target.closest(".w");if(!w)return;$$("#stext .w").forEach(x=>x.classList.remove("hl"));w.classList.add("hl");const g=$("#gloss");g.textContent=w.textContent+" — "+st.gloss[keys[+w.dataset.g]];g.classList.add("on");say(w.textContent)}}
function storyQuiz(id){const st=STORIES.find(x=>x.id===id);const ex=st.q.map(q=>({t:"choose",key:"",prompt:q[0],it:true,say:q[0],options:q[1],answer:q[2],show:q[1][q[2]]}));if(!S.stories)S.stories={};const done=()=>{S.stories[id]=true;save()};startLesson("custom",{custom:ex,title:st.title,mode:"practice"});const of=finishLesson;window.finishLesson=function(){done();window.finishLesson=of;of()}}

/* ---------- The method ---------- */
function method(){$("#s-method .wrap").innerHTML='<div class="row"><button class="btn ghost sm" onclick="showScreen(\'practice\')">← Practice</button><h1 class="grow" style="margin:0 0 0 10px">🧭 How to actually learn</h1></div><div class="card tip method"><p>Apps don\'t teach you to speak. <b>Speaking teaches you to speak.</b> The exercises here exist to load words and patterns into your head; these four habits are what turn them into a language you can use with the family.</p>'+
'<h3>The daily 25 minutes</h3>'+[["🔁","5 min · Review","Do the Review card first, every day. It shows you exactly the words that are about to fall out of your head. Say each one out loud, not in your head."],["🗺️","10 min · One lesson","One new lesson on the map. Read the grammar tip first (tap the circle → 📖). If you get something wrong, say the right answer aloud twice before you continue."],["🎧","5 min · Shadowing","Play a sentence, speak over it at the same time, copy the melody. Record and compare. This is the single fastest way to lose the American accent."],["💬","5 min · Talk to Nonna","Open Nonna Chat and tell her about your day, badly. She fixes one thing per message. By week three you\'ll notice you think of the Italian first."]].map(s=>'<div class="step"><i>'+s[0]+"</i><div><b>"+s[1]+'</b><div class="small">'+s[2]+"</div></div></div>").join("")+
'<h3>Weekly</h3><div class="step"><i>📖</i><div><b>Read one story</b><div class="small">Stories are where words stop being flashcards. Read it once for the gist, once tapping every word you don\'t know, then listen with your eyes closed.</div></div></div><div class="step"><i>🏆</i><div><b>Beat a region</b><div class="small">The boss challenge is a real check. If you fail it, the Mix drill for a few days is the cure.</div></div></div><div class="step"><i>📒</i><div><b>Ask the family for three words</b><div class="small">Text your girlfriend: "how does your nonna say X?" Put the answer in the Family notebook. These are the words that will make her family\'s faces light up.</div></div></div>'+
'<h3>What to expect</h3><p class="small">Week 1–2: you can greet, order, count and say who you are. Month 1: you finish Roma and Firenze and can say what you did yesterday. Month 2–3: Napoli and Venezia, and Nonna Chat starts feeling like a conversation instead of a test. Month 4–6: past, future, conditional, and you can follow a family lunch if they slow down. The subjunctive in Sardegna is the last piece; native speakers will forgive you for years on that one.</p><p class="small">Realistic minimum: 20 minutes, 5 days a week. Missing a day is fine. Missing a week resets your ear — the Review pile will tell you.</p></div>'}
