<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bravissimo — Learn Italian</title>
<meta name="description" content="Learn Italian with real recordings, seven regions of lessons, and eight dialects including Noepoli.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%87%AE%F0%9F%87%B9%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff6e9; --card:#ffffff; --ink:#2b2118; --muted:#7a6a5a; --line:#ecdcc8; --soft:#fbeedb;
  --red:#e63946; --red2:#b52b36; --green:#2fa84f; --green2:#218a3c; --gold:#f4b400; --gold2:#c48f00;
  --blue:#3a86ff; --blue2:#2b66c4; --purple:#8e44ad;
  --ok:#dff5e3; --okInk:#1c6b31; --bad:#ffe0e3; --badInk:#a3222d;
  --shadow:0 6px 20px rgba(60,30,0,.08);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1714; --card:#26211d; --ink:#f6efe6; --muted:#b3a496; --line:#3a322b; --soft:#2f2823;
    --ok:#1d3b27; --okInk:#9be3ad; --bad:#4a1f24; --badInk:#ffb3ba; --shadow:0 6px 20px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1714; --card:#26211d; --ink:#f6efe6; --muted:#b3a496; --line:#3a322b; --soft:#2f2823;
  --ok:#1d3b27; --okInk:#9be3ad; --bad:#4a1f24; --badInk:#ffb3ba; --shadow:0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 'Nunito',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
h1,h2,h3,.brand,.big{font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:600;letter-spacing:.2px}
h1{font-size:28px;margin:0 0 6px}
h2{font-size:22px;margin:18px 0 8px}
h3{font-size:18px;margin:14px 0 6px}
p{margin:6px 0}
button{font-family:inherit}
a{color:var(--blue)}
.wrap{max-width:600px;margin:0 auto;padding:0 16px}
#top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
#top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{font-size:22px;color:var(--red)}
.stats{display:flex;gap:10px;font-weight:800;font-size:15px}
.stats span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;box-shadow:var(--shadow)}
main{padding-bottom:90px}
.screen{display:none}
.screen.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav .wrap{display:flex;justify-content:space-around;padding:0}
#nav button{flex:1;border:0;background:none;padding:8px 4px 6px;font:700 11px 'Nunito';color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
#nav button i{font-style:normal;font-size:22px}
#nav button.on{color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin:12px 0}
.card.flat{box-shadow:none}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.center{text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:14px 22px;font:800 17px 'Nunito';background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green2);cursor:pointer;transition:transform .06s,box-shadow .06s;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green2)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red2)}
.btn.red:active{box-shadow:0 1px 0 var(--red2)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue2)}
.btn.blue:active{box-shadow:0 1px 0 var(--blue2)}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 var(--gold2);color:#3a2a00}
.btn.gold:active{box-shadow:0 1px 0 var(--gold2)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.btn.wide{width:100%}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.big{font-size:20px;padding:18px 28px}
.chip{display:inline-block;background:var(--soft);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;margin:2px}
.spk{border:0;background:var(--blue);color:#fff;border-radius:50%;width:46px;height:46px;font-size:20px;cursor:pointer;box-shadow:0 3px 0 var(--blue2);flex:none}
.spk.sm{width:36px;height:36px;font-size:16px}
.spk.slow{background:var(--purple);box-shadow:0 3px 0 #6a3181}
.spk:active{transform:translateY(2px);box-shadow:none}
/* map */
.world{border-radius:22px;padding:18px;color:#fff;margin:14px 0 6px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.world h2{margin:0;color:#fff;font-size:24px}
.world .sub{opacity:.9;font-weight:700}
.world .em{position:absolute;right:14px;top:8px;font-size:52px;opacity:.9}
.world.locked{filter:grayscale(.8);opacity:.7}
.path{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0 14px}
.nodewrap{display:flex;flex-direction:column;align-items:center;width:150px}
.node{width:76px;height:76px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer;box-shadow:0 7px 0 rgba(0,0,0,.2);background:var(--wc,#e63946);color:#fff;transition:transform .08s;position:relative}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.node.locked{background:#c9bfb3;color:#8a7f73;box-shadow:0 7px 0 #a89d90;cursor:not-allowed}
.node.done{background:var(--gold);box-shadow:0 7px 0 var(--gold2)}
.node.boss{width:92px;height:92px;font-size:44px}
.node .crown{position:absolute;top:-14px;font-size:22px}
.node.next::after{content:"INIZIA";position:absolute;bottom:-12px;background:var(--card);color:var(--ink);font:800 10px 'Nunito';padding:2px 8px;border-radius:999px;border:2px solid var(--line);letter-spacing:.5px}
.nlabel{font-weight:800;font-size:13px;text-align:center;margin-top:12px;max-width:150px}
.stars{font-size:13px;letter-spacing:1px;color:var(--gold)}
.mascot{display:flex;gap:12px;align-items:flex-end;margin:12px 0}
.mascot .face{font-size:54px;line-height:1;flex:none}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:12px 14px;box-shadow:var(--shadow);font-weight:600}
/* lesson */
#s-lesson{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;display:none}
#s-lesson.on{display:block}
.lhead{display:flex;align-items:center;gap:12px;padding:14px 0}
.xbtn{border:0;background:none;font-size:24px;cursor:pointer;color:var(--muted)}
.prog{flex:1;height:16px;background:var(--line);border-radius:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:8px;transition:width .3s;min-width:6px}
.hearts{font-weight:800;color:var(--red);font-size:16px;white-space:nowrap}
.ex{padding:6px 0 160px}
.ex h2{margin-top:6px}
.prompt{font-size:22px;font-weight:700;margin:10px 0}
.prompt.it{font-family:'Fredoka';font-size:26px;font-weight:600}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;background:var(--card);color:var(--ink);font:700 17px 'Nunito';margin:8px 0;cursor:pointer;transition:transform .05s}
.opt:active{transform:translateY(2px)}
.opt .k{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;flex:none}
.opt.sel{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,var(--card))}
.opt.ok{border-color:var(--green);background:var(--ok);color:var(--okInk)}
.opt.no{border-color:var(--red);background:var(--bad);color:var(--badInk)}
.opt.dim{opacity:.35;pointer-events:none}
input.ans,textarea.ans{width:100%;font:700 20px 'Nunito';padding:14px;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);outline:none}
input.ans:focus{border-color:var(--blue)}
.accents{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.accents button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 10px;font:700 16px 'Nunito';cursor:pointer}
.tiles{display:flex;flex-wrap:wrap;gap:6px;min-height:58px;padding:8px;border-bottom:2px solid var(--line);margin-bottom:14px}
.tiles.bank{border:0;justify-content:center}
.tile{padding:10px 14px;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:var(--card);color:var(--ink);cursor:pointer;font:700 17px 'Nunito'}
.tile.used{opacity:.25;pointer-events:none}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcols .opt{margin:0;justify-content:center;text-align:center;min-height:60px}
.mcols .opt.gone{opacity:.25;pointer-events:none;border-color:var(--green)}
.mcols .opt.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#fb{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:2px solid var(--line);padding:18px 0 22px;transform:translateY(110%);transition:transform .22s}
#fb.show{transform:none}
#fb.good{background:var(--ok);color:var(--okInk);border-color:var(--green)}
#fb.badly{background:var(--bad);color:var(--badInk);border-color:var(--red)}
#fb .ttl{font:600 22px 'Fredoka';margin-bottom:4px}
#fb .btn{margin-top:12px}
#fb.good .btn{background:var(--green)}
#fb.badly .btn{background:var(--red);box-shadow:0 4px 0 var(--red2)}
.tip{font-size:16px}
.tip table{border-collapse:collapse;width:100%;margin:8px 0;font-size:15px}
.tip td,.tip th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
.tip th{color:var(--muted);font-size:13px}
.tip b.it{color:var(--red)}
.tip ul{padding-left:20px;margin:6px 0}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:800;background:var(--soft);color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
.result{ text-align:center;padding:20px 0}
.result .big{font-size:40px;color:var(--red)}
.result .rx{display:flex;justify-content:center;gap:10px;margin:14px 0;flex-wrap:wrap}
.result .rx div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 16px;min-width:100px;box-shadow:var(--shadow)}
.result .rx b{display:block;font-size:22px}
.combo{position:fixed;top:70px;right:16px;background:var(--gold);color:#3a2a00;font:700 15px 'Fredoka';padding:6px 12px;border-radius:999px;z-index:35;animation:pop .35s;box-shadow:var(--shadow)}
@keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:45;display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .box{background:var(--card);border-radius:24px 24px 0 0;padding:22px 18px 30px;width:100%;max-width:600px;max-height:92vh;overflow:auto;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:14px;background:var(--card);cursor:pointer;text-align:left;color:var(--ink);font-family:inherit}
.pcard:active{transform:translateY(2px)}
.pcard i{font-style:normal;font-size:30px;display:block;margin-bottom:6px}
.pcard b{display:block;font-size:16px}
.pcard span{font-size:13px;color:var(--muted)}
.badge{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.badge i{font-style:normal;font-size:30px;width:44px;text-align:center}
.badge.off{opacity:.35;filter:grayscale(1)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:6px}
.wrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.wrow .it{font-weight:800}
.wrow .en{color:var(--muted);font-size:14px}
.str{display:flex;gap:2px}
.str i{width:8px;height:8px;border-radius:2px;background:var(--line)}
.str i.on{background:var(--green)}
select,input[type=text],input[type=number]{font:700 16px 'Nunito';padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:100%}
.cj{width:100%;border-collapse:collapse;margin:6px 0 14px;font-size:15px}
.cj td{padding:6px 8px;border-bottom:1px solid var(--line)}
.cj td:first-child{color:var(--muted);width:80px}
.cj td:last-child{font-weight:800}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tabs button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:800 14px 'Nunito';cursor:pointer}
.tabs button.on{background:var(--red);color:#fff;border-color:var(--red)}
.dial{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.dial .d{font:600 18px 'Fredoka';color:var(--red)}
.dial .s{font-size:14px}
.dial .e{color:var(--muted);font-size:13px}
.flash{min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center;font:600 30px 'Fredoka';cursor:pointer;user-select:none}
.timer{font:600 30px 'Fredoka';color:var(--red)}
.kbd{font-size:12px;color:var(--muted);margin-top:10px}
.mic{width:90px;height:90px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:38px;box-shadow:0 5px 0 var(--red2);cursor:pointer;margin:14px auto;display:block}
.mic.on{animation:pulse 1s infinite;background:var(--green);box-shadow:0 5px 0 var(--green2)}
@keyframes pulse{50%{transform:scale(1.08)}}
.hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.note{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px}
label.sw{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-weight:700;gap:10px}
label.sw input{width:22px;height:22px}
.lvl{font:600 14px 'Fredoka';color:var(--muted)}
.big-ital{font:600 34px 'Fredoka';color:var(--red)}
@media (max-width:420px){.grid2{grid-template-columns:1fr 1fr}.prompt.it{font-size:23px}}
</style>
</head>
<body>
<header id="top"><div class="wrap">
  <div class="brand">🇮🇹 Bravissimo</div>
  <div class="stats"><span id="stStreak" title="Day streak">🔥 0</span><span id="stXp" title="Total XP">⭐ 0</span></div>
</div></header>
<main>
  <section id="s-home" class="screen on"><div class="wrap"></div></section>
  <section id="s-practice" class="screen"><div class="wrap"></div></section>
  <section id="s-study" class="screen"><div class="wrap"></div></section>
  <section id="s-dialects" class="screen"><div class="wrap"></div></section>
  <section id="s-me" class="screen"><div class="wrap"></div></section>
</main>
<section id="s-lesson"><div class="wrap"><div class="lhead"><button class="xbtn" onclick="quitLesson()">✕</button><div class="prog"><i id="lprog"></i></div><div class="hearts" id="lhearts"></div></div><div class="ex" id="exbox"></div></div></section>
<div id="fb"><div class="wrap"><div class="ttl" id="fbTitle"></div><div id="fbBody"></div><button class="btn wide" id="fbBtn" onclick="nextEx()">Continua</button></div></div>
<nav id="nav"><div class="wrap">
  <button data-s="home" class="on"><i>🗺️</i>Map</button>
  <button data-s="practice"><i>🎯</i>Practice</button>
  <button data-s="study"><i>📚</i>Study</button>
  <button data-s="dialects"><i>🗣️</i>Dialects</button>
  <button data-s="me"><i>👤</i>Me</button>
</div></nav>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<canvas id="confetti"></canvas>
<script>window.AUDIO_CLIPS=window.AUDIO_CLIPS||{};</script>
<script>
/* ===================== CURRICULUM: WORLDS 1-3 ===================== */
const WORLDS=[
{id:"roma",name:"Roma",sub:"Le basi · The basics",emoji:"🏛️",color:"#e63946",dialect:"romanesco",lessons:[
{id:"roma1",title:"Saluti",icon:"👋",
tip:{title:"Hello, Italy!",html:`<p>Italians greet <b>a lot</b>. Two rules keep you out of trouble:</p>
<ul><li><b class=it>Ciao</b> is friendly and informal — friends, family, kids. It means <i>hi</i> AND <i>bye</i>.</li>
<li><b class=it>Buongiorno</b> (morning/day) and <b class=it>Buonasera</b> (evening) work with everyone, including strangers and shopkeepers. When in doubt, use these.</li></ul>
<p><b class=it>Salve</b> is a safe middle: polite but not stiff.</p>
<p>Italian has two "you"s: <b class=it>tu</b> (friends) and <b class=it>Lei</b> (strangers, older people, formal). So <i>How are you?</i> is <b class=it>Come stai?</b> to a friend but <b class=it>Come sta?</b> to a stranger.</p>
<p>Fun fact: <b class=it>ciao</b> comes from Venetian <i>s-ciavo</i> — "I am your servant". You'll meet Venetian later!</p>`},
vocab:[["ciao","hi|hello|bye","informal — hi AND bye"],["buongiorno","good morning|good day|hello"],["buonasera","good evening"],["buonanotte","good night","only when going to bed"],["salve","hello","polite, neutral"],["arrivederci","goodbye"],["a presto","see you soon"],["a domani","see you tomorrow"],["a dopo","see you later"],["grazie","thank you|thanks"],["grazie mille","thanks a lot|thank you very much","literally: a thousand thanks"],["prego","you're welcome|please go ahead","also 'after you' / 'come in'"],["per favore","please"],["scusa","sorry|excuse me","informal"],["scusi","excuse me|sorry","formal"],["sì","yes"],["no","no"],["come stai?","how are you?","informal"],["come sta?","how are you?","formal"],["come va?","how's it going?"],["bene","well|good|fine"],["molto bene","very well"],["così così","so-so"],["e tu?","and you?"],["piacere","nice to meet you|pleasure"],["benvenuto","welcome","benvenuta to a woman"],["tutto bene?","everything ok?"]],
sent:[["Ciao, come stai?","Hi, how are you?"],["Sto bene, grazie.","I'm fine, thanks."],["Buongiorno, signora!","Good morning, madam!"],["Arrivederci e a presto.","Goodbye and see you soon."],["Piacere, io sono Marco.","Nice to meet you, I'm Marco."],["Scusi, parla inglese?","Excuse me, do you speak English?"],["Grazie mille!","Thanks a lot!"],["Prego, non c'è di che.","You're welcome, don't mention it."],["Buonanotte e sogni d'oro.","Good night and sweet dreams."],["Come va? Tutto bene.","How's it going? All good."]]},
{id:"roma2",title:"Pronuncia",icon:"🔤",
tip:{title:"Say it like an Italian",html:`<p>Italian is <b>phonetic</b>: every letter is pronounced, always the same way. Vowels are pure: <b class=it>a</b> "ah", <b class=it>e</b> "eh", <b class=it>i</b> "ee", <b class=it>o</b> "oh", <b class=it>u</b> "oo".</p>
<table><tr><th>Letters</th><th>Sound</th><th>Example</th></tr>
<tr><td><b class=it>c</b> + a/o/u</td><td>hard "k"</td><td>casa, cosa</td></tr>
<tr><td><b class=it>c</b> + e/i</td><td>"ch"</td><td>cena, ciao</td></tr>
<tr><td><b class=it>ch</b></td><td>hard "k"</td><td>chiesa, bruschetta</td></tr>
<tr><td><b class=it>g</b> + e/i</td><td>"j"</td><td>gelato, giorno</td></tr>
<tr><td><b class=it>gh</b></td><td>hard "g"</td><td>ghiaccio, spaghetti</td></tr>
<tr><td><b class=it>gn</b></td><td>"ny" (canyon)</td><td>gnocchi, bagno</td></tr>
<tr><td><b class=it>gli</b></td><td>"ly" (million)</td><td>famiglia, figlio</td></tr>
<tr><td><b class=it>sc</b> + e/i</td><td>"sh"</td><td>pesce, prosciutto</td></tr>
<tr><td><b class=it>z</b></td><td>"ts" / "dz"</td><td>pizza, zucchero</td></tr>
<tr><td><b class=it>h</b></td><td>silent</td><td>ho, hotel</td></tr></table>
<p><b>Double consonants matter.</b> Hold them longer: <b class=it>nonno</b> (grandpa) vs <b class=it>nono</b> (ninth), <b class=it>penna</b> (pen) vs <b class=it>pena</b> (pain).</p>
<p><b>Stress</b> usually falls on the second-to-last syllable. A written accent means stress on that vowel: cit<b>tà</b>, caf<b>fè</b>.</p>
<p>Tap the speaker 🔊 in every exercise and repeat out loud. Nonna is listening.</p>`},

{id:"roma3",title:"Presentarsi",icon:"🙋",
tip:{title:"Introducing yourself",html:`<p>Three ways to say who you are:</p>
<ul><li><b class=it>Mi chiamo Anna.</b> — My name is Anna. (literally: I call myself Anna)</li>
<li><b class=it>Sono Anna.</b> — I'm Anna.</li>
<li><b class=it>Io sono Anna.</b> — the <i>io</i> (I) is optional; Italians usually drop subject pronouns because the verb ending already tells you who.</li></ul>
<p>Where you're from: <b class=it>Sono di Chicago.</b> (city) · <b class=it>Vengo dagli Stati Uniti.</b> (I come from the USA) · <b class=it>Sono americana.</b> (woman) / <b class=it>americano</b> (man).</p>
<p>Age uses <b>have</b>, not <b>be</b>: <b class=it>Ho trent'anni.</b> = I have thirty years.</p>
<p>Lifesavers: <b class=it>Non capisco</b> (I don't understand), <b class=it>Più lentamente, per favore</b> (slower, please), <b class=it>Può ripetere?</b> (can you repeat?).</p>`},

{id:"roma4",title:"Numeri",icon:"🔢",
tip:{title:"Counting",html:`<p>Learn 0–20 by heart, then the tens. Everything else is glued together.</p>
<table><tr><td>1 uno</td><td>6 sei</td><td>11 undici</td><td>16 sedici</td></tr>
<tr><td>2 due</td><td>7 sette</td><td>12 dodici</td><td>17 diciassette</td></tr>
<tr><td>3 tre</td><td>8 otto</td><td>13 tredici</td><td>18 diciotto</td></tr>
<tr><td>4 quattro</td><td>9 nove</td><td>14 quattordici</td><td>19 diciannove</td></tr>
<tr><td>5 cinque</td><td>10 dieci</td><td>15 quindici</td><td>20 venti</td></tr></table>
<p>Tens: <b class=it>venti, trenta, quaranta, cinquanta, sessanta, settanta, ottanta, novanta, cento</b>.</p>
<p>Glue rule: <b class=it>venti + due = ventidue</b>. Before <b>uno</b> and <b>otto</b> the tens lose their last vowel: <b class=it>ventuno, ventotto, trentuno</b>. With <b>tre</b> add an accent: <b class=it>ventitré</b>.</p>
<p>Hundreds: <b class=it>cento, duecento, trecento</b>… Thousands: <b class=it>mille</b> (1000) but <b class=it>duemila</b> (2000). So 2026 = <b class=it>duemilaventisei</b>.</p>`},

{id:"roma5",title:"Essere & Avere",icon:"⚡",
tip:{title:"The two verbs you'll use 1,000 times a day",html:`<table><tr><th></th><th>essere (to be)</th><th>avere (to have)</th></tr>
<tr><td>io</td><td><b class=it>sono</b></td><td><b class=it>ho</b></td></tr>
<tr><td>tu</td><td><b class=it>sei</b></td><td><b class=it>hai</b></td></tr>
<tr><td>lui / lei</td><td><b class=it>è</b></td><td><b class=it>ha</b></td></tr>
<tr><td>noi</td><td><b class=it>siamo</b></td><td><b class=it>abbiamo</b></td></tr>
<tr><td>voi</td><td><b class=it>siete</b></td><td><b class=it>avete</b></td></tr>
<tr><td>loro</td><td><b class=it>sono</b></td><td><b class=it>hanno</b></td></tr></table>
<p>The <b>h</b> in ho / hai / ha / hanno is silent — it's only there so they don't look like other words (<i>o</i> = or, <i>a</i> = to, <i>anno</i> = year).</p>
<p><b>Italians "have" feelings that English "is":</b> <b class=it>ho fame</b> (I'm hungry), <b class=it>ho sete</b> (thirsty), <b class=it>ho sonno</b> (sleepy), <b class=it>ho caldo / freddo</b> (hot / cold), <b class=it>ho paura</b> (scared), <b class=it>ho fretta</b> (in a hurry), <b class=it>hai ragione</b> (you're right).</p>
<p><b class=it>C'è</b> = there is · <b class=it>Ci sono</b> = there are.</p>`},

{id:"roma6",title:"Articoli e genere",icon:"📦",
tip:{title:"Every noun has a gender",html:`<p>Italian nouns are masculine or feminine — even tables and chairs. The ending usually tells you:</p>
<ul><li><b class=it>-o</b> → masculine: il libr<b>o</b>, il tavol<b>o</b></li><li><b class=it>-a</b> → feminine: la cas<b>a</b>, la sedi<b>a</b></li><li><b class=it>-e</b> → could be either: il fior<b>e</b> (m), la chiav<b>e</b> (f). Learn these with their article.</li></ul>
<p><b>"The" has seven forms.</b></p>
<table><tr><th></th><th>singular</th><th>plural</th></tr>
<tr><td>masc.</td><td><b class=it>il</b> libro</td><td><b class=it>i</b> libri</td></tr>
<tr><td>masc. before s+consonant, z, gn, ps, y</td><td><b class=it>lo</b> zaino, lo studente</td><td><b class=it>gli</b> zaini</td></tr>
<tr><td>masc. before vowel</td><td><b class=it>l'</b>amico</td><td><b class=it>gli</b> amici</td></tr>
<tr><td>fem.</td><td><b class=it>la</b> casa</td><td><b class=it>le</b> case</td></tr>
<tr><td>fem. before vowel</td><td><b class=it>l'</b>amica</td><td><b class=it>le</b> amiche</td></tr></table>
<p><b>"A / an":</b> <b class=it>un</b> libro, <b class=it>uno</b> zaino, <b class=it>una</b> casa, <b class=it>un'</b>amica.</p>
<p><b>Plurals:</b> -o → -i, -a → -e, -e → -i. Watch out: <b class=it>il problema</b> is masculine (i problemi), <b class=it>la mano</b> is feminine (le mani), and words ending in an accent or a consonant never change (la città → le città, il bar → i bar).</p>`},

{id:"roma7",title:"La famiglia",icon:"👨‍👩‍👧",
tip:{title:"Family, and the 'my' rule",html:`<p>"My" agrees with the thing you own: <b class=it>il mio</b> libro, <b class=it>la mia</b> casa, <b class=it>i miei</b> libri, <b class=it>le mie</b> case. Same for <b class=it>tuo/tua</b> (your) and <b class=it>suo/sua</b> (his / her — yes, the same word!).</p>
<p>Normally possessives take an article: <b class=it>la mia</b> macchina. But with <b>one family member in the singular</b> you drop it: <b class=it>mia madre</b>, <b class=it>tuo fratello</b>, <b class=it>sua sorella</b>.</p>
<p>Plural family gets the article back: <b class=it>i miei genitori</b>, <b class=it>le mie sorelle</b>. Pet names too: <b class=it>la mia mamma</b>, <b class=it>il mio papà</b>.</p>
<p><b class=it>I miei</b> on its own means "my parents" — <i>Vado dai miei</i> = I'm going to my folks'.</p>`},

{id:"firenze",name:"Firenze",sub:"La vita di ogni giorno · Daily life",emoji:"🎨",color:"#d7743a",dialect:"toscano",lessons:[
{id:"fi1",title:"Verbi in -are",icon:"🗣️",
tip:{title:"Your first verb family",html:`<p>Most Italian verbs end in <b class=it>-are</b>. Chop it off, keep the stem, add the ending for the person:</p>
<table><tr><th></th><th>parl<b>are</b> (to speak)</th></tr>
<tr><td>io</td><td>parl<b class=it>o</b></td></tr><tr><td>tu</td><td>parl<b class=it>i</b></td></tr><tr><td>lui / lei</td><td>parl<b class=it>a</b></td></tr>
<tr><td>noi</td><td>parl<b class=it>iamo</b></td></tr><tr><td>voi</td><td>parl<b class=it>ate</b></td></tr><tr><td>loro</td><td>parl<b class=it>ano</b></td></tr></table>
<p>Works for mangiare, lavorare, studiare, abitare, comprare… hundreds of verbs.</p>
<p>Tiny spelling fixes: verbs in <b class=it>-care / -gare</b> add an <b>h</b> to keep the hard sound: cer<b>chi</b>, pa<b>ghi</b>amo. Verbs in <b class=it>-ciare / -giare</b> don't double the i: man<b>gi</b> (not mangii).</p>
<p>Negative is easy: put <b class=it>non</b> before the verb. <b class=it>Non parlo.</b> = I don't speak.</p>`},

{id:"fi2",title:"Giorni e mesi",icon:"📅",
tip:{title:"Days, months, seasons",html:`<p>Days and months are <b>lowercase</b> in Italian. The week starts on Monday.</p>
<p>lunedì · martedì · mercoledì · giovedì · venerdì · sabato · domenica</p>
<p><b class=it>Il lunedì</b> (with the article) means "on Mondays", every Monday. <b class=it>Lunedì</b> alone = this Monday.</p>
<p>gennaio · febbraio · marzo · aprile · maggio · giugno · luglio · agosto · settembre · ottobre · novembre · dicembre</p>
<p>Dates: <b class=it>il 3 maggio</b> (the 3 May) — plain numbers, except the first: <b class=it>il primo maggio</b>.</p>
<p>Seasons: <b class=it>in primavera, in estate, in autunno, in inverno</b>.</p>`},

{id:"fi3",title:"Che ore sono?",icon:"⏰",
tip:{title:"Telling time",html:`<p>Hours are plural (the hours are…): <b class=it>Sono le due</b> = it's two. Except one o'clock, noon and midnight, which are singular: <b class=it>È l'una · È mezzogiorno · È mezzanotte</b>.</p>
<ul><li>3:15 → <b class=it>le tre e un quarto</b></li><li>3:30 → <b class=it>le tre e mezza</b></li><li>3:45 → <b class=it>le quattro meno un quarto</b> (four minus a quarter)</li><li>3:20 → <b class=it>le tre e venti</b></li><li>3:50 → <b class=it>le quattro meno dieci</b></li></ul>
<p>"At" a time: <b class=it>alle tre</b>, <b class=it>all'una</b>, <b class=it>a mezzogiorno</b>. Question: <b class=it>A che ora?</b></p>
<p>Italians say <b class=it>di mattina / del pomeriggio / di sera</b> instead of AM/PM, and use the 24-hour clock for timetables: <b class=it>le diciotto</b> = 6 PM.</p>`},

{id:"fi4",title:"Verbi in -ere e -ire",icon:"📖",
tip:{title:"The other two verb families",html:`<table><tr><th></th><th>legg<b>ere</b> (read)</th><th>dorm<b>ire</b> (sleep)</th><th>cap<b>ire</b> (understand)</th></tr>
<tr><td>io</td><td>legg<b class=it>o</b></td><td>dorm<b class=it>o</b></td><td>cap<b class=it>isco</b></td></tr>
<tr><td>tu</td><td>legg<b class=it>i</b></td><td>dorm<b class=it>i</b></td><td>cap<b class=it>isci</b></td></tr>
<tr><td>lui / lei</td><td>legg<b class=it>e</b></td><td>dorm<b class=it>e</b></td><td>cap<b class=it>isce</b></td></tr>
<tr><td>noi</td><td>legg<b class=it>iamo</b></td><td>dorm<b class=it>iamo</b></td><td>cap<b class=it>iamo</b></td></tr>
<tr><td>voi</td><td>legg<b class=it>ete</b></td><td>dorm<b class=it>ite</b></td><td>cap<b class=it>ite</b></td></tr>
<tr><td>loro</td><td>legg<b class=it>ono</b></td><td>dorm<b class=it>ono</b></td><td>cap<b class=it>iscono</b></td></tr></table>
<p>Notice <b class=it>-iamo</b> for "we" is the same in every family. Nice.</p>
<p>Some -ire verbs insert <b class=it>-isc-</b> in all forms except noi and voi: capire, finire, preferire, pulire, spedire. There's no rule for which ones — you'll learn them as you go.</p>`},

{id:"fi5",title:"Colori e aggettivi",icon:"🎨",
tip:{title:"Adjectives agree — and usually come after",html:`<p>An adjective changes its ending to match the noun's gender and number:</p>
<table><tr><th></th><th>masc.</th><th>fem.</th></tr><tr><td>singular</td><td>il libro ross<b class=it>o</b></td><td>la casa ross<b class=it>a</b></td></tr><tr><td>plural</td><td>i libri ross<b class=it>i</b></td><td>le case ross<b class=it>e</b></td></tr></table>
<p>Adjectives ending in <b class=it>-e</b> have only two forms: grand<b>e</b> / grand<b>i</b>, verd<b>e</b> / verd<b>i</b>.</p>
<p>Unlike English, most adjectives go <b>after</b> the noun: <b class=it>una macchina rossa</b>, <b class=it>un ragazzo simpatico</b>. A few common ones (bello, brutto, buono, grande, piccolo, nuovo, vecchio) can go before.</p>
<p>Colours that never change: <b class=it>blu, rosa, viola</b>. <i>Le scarpe blu</i>.</p>`},

tip:{title:"Food is a serious matter",html:`<p>Meals: <b class=it>la colazione</b> (breakfast — usually just a coffee and a pastry), <b class=it>il pranzo</b> (lunch, the big one), <b class=it>la cena</b> (dinner, late — 8 or 9 PM), <b class=it>lo spuntino</b> (snack).</p>

{id:"na2",title:"Al ristorante",icon:"🍽️",
tip:{title:"Ordering like a local",html:`<p>The magic word is <b class=it>vorrei</b> — "I would like". Polite, soft, works everywhere. <i>Vorrei un caffè.</i></p>
<p>An Italian menu has courses: <b class=it>l'antipasto</b> (starter), <b class=it>il primo</b> (pasta, risotto, soup), <b class=it>il secondo</b> (meat or fish), <b class=it>il contorno</b> (side dish, ordered separately!), <b class=it>il dolce</b>. Nobody expects you to order all of them.</p>
<p><b class=it>Il conto, per favore</b> = the bill, please. You'll usually see <b class=it>il coperto</b> — a small cover charge per person. Tipping is optional; rounding up is plenty.</p>
<p><b class=it>Buon appetito!</b> before eating, <b class=it>Cin cin!</b> when clinking glasses.</p>`},

{id:"na3",title:"Mi piace",icon:"❤️",
tip:{title:"Liking things — backwards",html:`<p>Italian doesn't say "I like pizza". It says "pizza is pleasing to me": <b class=it>Mi piace la pizza.</b></p>
<p>So the verb agrees with the <b>thing</b>, not with you:</p>
<ul><li>one thing → <b class=it>mi piace</b>: <i>Mi piace il gelato.</i></li><li>several things → <b class=it>mi piacciono</b>: <i>Mi piacciono i gatti.</i></li><li>doing something → <b class=it>mi piace</b> + verb: <i>Mi piace cantare.</i></li></ul>
<p>Change who likes it by changing the little word: <b class=it>mi</b> (I), <b class=it>ti</b> (you), <b class=it>gli</b> (he), <b class=it>le</b> (she), <b class=it>ci</b> (we), <b class=it>vi</b> (you all), <b class=it>gli</b> (they). With a name: <b class=it>A Marco piace il calcio.</b></p>
<p>Not liking: <b class=it>Non mi piace.</b> Loving it: <b class=it>Mi piace da morire</b> — "I like it to death".</p>`},

{id:"na4",title:"Andare, fare, stare, dare",icon:"🚀",
tip:{title:"Four rebels",html:`<p>These four -are verbs refuse to follow the rules. They're so common you'll memorise them by accident.</p>
<table><tr><th></th><th>andare (go)</th><th>fare (do/make)</th><th>stare (stay/be)</th><th>dare (give)</th></tr>
<tr><td>io</td><td>vado</td><td>faccio</td><td>sto</td><td>do</td></tr>
<tr><td>tu</td><td>vai</td><td>fai</td><td>stai</td><td>dai</td></tr>
<tr><td>lui/lei</td><td>va</td><td>fa</td><td>sta</td><td>dà</td></tr>
<tr><td>noi</td><td>andiamo</td><td>facciamo</td><td>stiamo</td><td>diamo</td></tr>
<tr><td>voi</td><td>andate</td><td>fate</td><td>state</td><td>date</td></tr>
<tr><td>loro</td><td>vanno</td><td>fanno</td><td>stanno</td><td>danno</td></tr></table>
<p><b class=it>Fare</b> is everywhere: fare colazione (have breakfast), fare la spesa (grocery shopping), fare una foto, fare una passeggiata (take a walk), fare una domanda (ask a question). Weather too: <b class=it>fa caldo, fa freddo</b>.</p>
<p><b class=it>Stare</b> is how you are: <b class=it>Come stai? Sto bene.</b></p>`},

{id:"na5",title:"Preposizioni",icon:"🧭",
tip:{title:"Little words, big job",html:`<p>The main prepositions: <b class=it>di</b> (of), <b class=it>a</b> (to/at), <b class=it>da</b> (from / at someone's place), <b class=it>in</b> (in/to), <b class=it>con</b> (with), <b class=it>su</b> (on), <b class=it>per</b> (for), <b class=it>tra/fra</b> (between / in… time).</p>
<p><b>Cities take <i>a</i>, countries and regions take <i>in</i>:</b> <b class=it>a Roma</b>, <b class=it>in Italia</b>, <b class=it>in Sicilia</b>.</p>
<p><b>They merge with "the":</b></p>
<table><tr><th></th><th>il</th><th>lo</th><th>la</th><th>l'</th><th>i</th><th>gli</th><th>le</th></tr>
<tr><td>a</td><td>al</td><td>allo</td><td>alla</td><td>all'</td><td>ai</td><td>agli</td><td>alle</td></tr>
<tr><td>di</td><td>del</td><td>dello</td><td>della</td><td>dell'</td><td>dei</td><td>degli</td><td>delle</td></tr>
<tr><td>da</td><td>dal</td><td>dallo</td><td>dalla</td><td>dall'</td><td>dai</td><td>dagli</td><td>dalle</td></tr>
<tr><td>in</td><td>nel</td><td>nello</td><td>nella</td><td>nell'</td><td>nei</td><td>negli</td><td>nelle</td></tr>
<tr><td>su</td><td>sul</td><td>sullo</td><td>sulla</td><td>sull'</td><td>sui</td><td>sugli</td><td>sulle</td></tr></table>
<p><b class=it>Da</b> + person = at their place: <b class=it>Vado dal medico</b> (to the doctor's), <b class=it>Ceno da Maria</b> (at Maria's).</p>`},

{id:"na6",title:"Al mercato",icon:"🛒",
tip:{title:"Shopping and prices",html:`<p><b class=it>Quanto costa?</b> = how much is it? (one thing) · <b class=it>Quanto costano?</b> (several) · or simply <b class=it>Quant'è?</b> = how much is it all?</p>
<p>Weights: <b class=it>un chilo</b> (1 kg), <b class=it>mezzo chilo</b>, <b class=it>un etto</b> (100 g — you'll hear this constantly at the deli: <i>due etti di prosciutto</i>).</p>
<p>The vendor will ask <b class=it>Altro?</b> (anything else?). You answer <b class=it>Basta così, grazie</b> (that's all, thanks). Then <b class=it>Ecco il resto</b> — here's your change — and <b class=it>lo scontrino</b>, the receipt.</p>
<p>Prices: <b class=it>due euro e cinquanta</b> = €2.50. "Euro" never changes in the plural.</p>`},

{id:"ve1",title:"In città",icon:"🏙️",
tip:{title:"Places in town",html:`<p>The heart of every Italian town is <b class=it>la piazza</b>. Streets are <b class=it>via</b> (Via Roma), bigger ones <b class=it>corso</b> or <b class=it>viale</b>.</p>
<p><b class=it>Il bar</b> is not a bar — it's a café where you drink espresso standing up. <b class=it>Il centro</b> is downtown, the old part.</p>
<p>"There is a…?" → <b class=it>C'è una farmacia qui vicino?</b> (Is there a pharmacy near here?)</p>`},

{id:"ve2",title:"Indicazioni",icon:"🧭",
tip:{title:"Asking the way",html:`<p>Start polite: <b class=it>Scusi, dov'è la stazione?</b> (Excuse me, where is the station?)</p>
<p>Answers you'll hear:</p><ul><li><b class=it>Sempre dritto</b> — straight ahead</li><li><b class=it>A destra / a sinistra</b> — right / left</li><li><b class=it>La prima a destra</b> — first right</li><li><b class=it>In fondo alla via</b> — at the end of the street</li><li><b class=it>Di fronte a…</b> — opposite…</li><li><b class=it>È a cinque minuti a piedi</b> — five minutes on foot</li></ul>
<p>Formal commands sound like: <b class=it>Vada dritto, poi giri a sinistra</b> (go straight, then turn left). Friends say <b class=it>Vai dritto, poi gira</b>.</p>
<p>Lost? <b class=it>Mi sono perso</b> (man) / <b class=it>persa</b> (woman).</p>`},

{id:"ve3",title:"Trasporti",icon:"🚆",
tip:{title:"Getting around",html:`<p>Means of transport take <b class=it>in</b>: <b class=it>in treno, in autobus, in aereo, in macchina, in bici</b>. Except walking: <b class=it>a piedi</b>.</p>
<p>At the station: <b class=it>un biglietto per Venezia</b> (a ticket to Venice), <b class=it>solo andata</b> (one way) or <b class=it>andata e ritorno</b> (round trip). Trains leave from <b class=it>il binario</b> (platform). <b>Validate your ticket</b> before boarding regional trains: <b class=it>convalidare il biglietto</b>.</p>
<p><b class=it>In ritardo</b> = late, <b class=it>in orario</b> = on time, <b class=it>in anticipo</b> = early.</p>`},

{id:"ve4",title:"Potere, volere, dovere",icon:"💪",
tip:{title:"Can, want, must",html:`<table><tr><th></th><th>potere (can)</th><th>volere (want)</th><th>dovere (must)</th></tr>
<tr><td>io</td><td>posso</td><td>voglio</td><td>devo</td></tr><tr><td>tu</td><td>puoi</td><td>vuoi</td><td>devi</td></tr><tr><td>lui/lei</td><td>può</td><td>vuole</td><td>deve</td></tr>
<tr><td>noi</td><td>possiamo</td><td>vogliamo</td><td>dobbiamo</td></tr><tr><td>voi</td><td>potete</td><td>volete</td><td>dovete</td></tr><tr><td>loro</td><td>possono</td><td>vogliono</td><td>devono</td></tr></table>
<p>They're followed by a plain infinitive: <b class=it>Devo studiare. Voglio dormire. Posso entrare?</b></p>
<p><b class=it>Vorrei</b> (I'd like) is the softer form of <i>voglio</i>. Use it in shops — <i>voglio</i> sounds like a toddler.</p>
<p>Two ways to "know": <b class=it>sapere</b> = know a fact / know how to (<i>So nuotare</i>), <b class=it>conoscere</b> = know a person or place (<i>Conosco Marco</i>).</p>`},

{id:"ve5",title:"Passato prossimo I",icon:"📜",
tip:{title:"Talking about the past (with avere)",html:`<p>The everyday past tense has two pieces: a helper (<b>avere</b>, usually) + a past participle.</p>
<p>Make the participle: -are → <b class=it>-ato</b> (mangiato), -ere → <b class=it>-uto</b> (avuto), -ire → <b class=it>-ito</b> (dormito).</p>
<table><tr><td>io</td><td><b class=it>ho</b> mangiato</td><td>I ate / I have eaten</td></tr><tr><td>tu</td><td><b class=it>hai</b> mangiato</td><td>you ate</td></tr><tr><td>lui/lei</td><td><b class=it>ha</b> mangiato</td><td>he/she ate</td></tr><tr><td>noi</td><td><b class=it>abbiamo</b> mangiato</td><td>we ate</td></tr><tr><td>voi</td><td><b class=it>avete</b> mangiato</td><td>you ate</td></tr><tr><td>loro</td><td><b class=it>hanno</b> mangiato</td><td>they ate</td></tr></table>
<p>Irregular participles worth stealing now: fatto (fare), detto (dire), visto (vedere), preso (prendere), letto (leggere), scritto (scrivere), aperto (aprire), messo (mettere), chiesto (chiedere), bevuto (bere), perso (perdere).</p>
<p>Time words: <b class=it>ieri, la settimana scorsa, l'anno scorso, due giorni fa</b> (two days ago), <b class=it>già</b> (already), <b class=it>non… ancora</b> (not yet).</p>`},

sent:[["Ieri ho mangiato una pizza enorme.","Yesterday I ate a huge pizza."],["Hai visto il film?","Did you see the film?"],["Abbiamo fatto una passeggiata.","We took a walk."],["Ha letto tutto il libro in un giorno.","She read the whole book in one day."],["Non ho ancora finito.","I haven't finished yet."],["Hanno comprato una casa a Venezia.","They bought a house in Venice."],["Ho perso le chiavi.","I lost the keys."],["Cosa hai detto?","What did you say?"],["Avete bevuto il vino?","Did you all drink the wine?"],["L'anno scorso ho visitato Roma.","Last year I visited Rome."],["Ho già capito.","I've already understood."]],

{id:"ve6",title:"Passato prossimo II",icon:"🚶",
tip:{title:"The past with essere",html:`<p>Verbs of <b>movement and change</b> use <b>essere</b> as the helper instead of avere: andare, venire, arrivare, partire, tornare, uscire, entrare, nascere, morire, stare, essere, rimanere, diventare, cadere, salire, scendere. Also all reflexive verbs (next world).</p>
<p>With essere, the participle <b>agrees like an adjective</b>:</p>
<table><tr><td>Marco</td><td><b class=it>è andato</b></td><td>Anna</td><td><b class=it>è andata</b></td></tr><tr><td>i ragazzi</td><td><b class=it>sono andati</b></td><td>le ragazze</td><td><b class=it>sono andate</b></td></tr></table>
<p>So a woman says <b class=it>Sono andata al mare</b>, a man says <b class=it>Sono andato</b>.</p>
<p>Irregular ones: <b class=it>stato</b> (essere AND stare), <b class=it>venuto, nato, morto, rimasto, sceso</b>.</p>`},

{id:"milano",name:"Milano",sub:"Lavoro e stile · Work and style",emoji:"👔",color:"#8e44ad",dialect:"milanese",lessons:[
{id:"mi1",title:"Lavoro e professioni",icon:"💼",
tip:{title:"What do you do?",html:`<p><b class=it>Che lavoro fai?</b> — what do you do? Answer with <b class=it>faccio + il/la + job</b> or <b class=it>sono + job</b> (no article): <i>Faccio la cuoca. Sono cuoca.</i></p>
<p>Many jobs change ending by gender: cuoc<b>o</b>/cuoc<b>a</b>, commess<b>o</b>/commess<b>a</b>, infermier<b>e</b>/infermier<b>a</b>. Some don't: <b class=it>l'insegnante, il/la giornalista</b>.</p>
<p><b class=it>Il capo</b> is the boss. <b class=it>I colleghi</b> are colleagues. <b class=it>La riunione</b> is a meeting (the word is not <i>meeting</i>, though Milanese people say that too).</p>`},

{id:"mi2",title:"Vestiti e shopping",icon:"👗",
tip:{title:"Clothes and 'this / that'",html:`<p><b class=it>Questo</b> = this, <b class=it>quello</b> = that. They agree like adjectives: <b class=it>questa giacca, questi jeans, quelle scarpe</b>.</p>
<p>In a shop: <b class=it>Posso provare…?</b> (can I try…?), <b class=it>Che taglia porta?</b> (what size do you wear?), <b class=it>il camerino</b> (fitting room). Shoe size is <b class=it>il numero</b>.</p>
<p><b class=it>I saldi</b> — the sales — happen in January and July. <b class=it>Sconto</b> = discount.</p>
<p>"To wear" is <b class=it>portare</b> or <b class=it>indossare</b>. <i>Porto sempre gli occhiali.</i></p>`},

{id:"mi3",title:"Verbi riflessivi",icon:"🪞",
tip:{title:"Doing things to yourself",html:`<p>Reflexive verbs end in <b class=it>-si</b> in the dictionary: <b class=it>alzarsi</b> (to get up), <b class=it>chiamarsi</b> (to be called), <b class=it>divertirsi</b> (to have fun). You conjugate the verb normally and put a little pronoun in front:</p>
<table><tr><td>io</td><td><b class=it>mi</b> alzo</td><td>noi</td><td><b class=it>ci</b> alziamo</td></tr><tr><td>tu</td><td><b class=it>ti</b> alzi</td><td>voi</td><td><b class=it>vi</b> alzate</td></tr><tr><td>lui/lei</td><td><b class=it>si</b> alza</td><td>loro</td><td><b class=it>si</b> alzano</td></tr></table>
<p>In the past they always take <b>essere</b>: <b class=it>Mi sono alzato/a alle sei.</b></p>
<p>The morning routine is all reflexive: <b class=it>mi sveglio, mi alzo, mi lavo, mi vesto, mi faccio la doccia</b>. And feelings: <b class=it>mi sento bene, mi arrabbio, mi preoccupo, mi diverto</b>.</p>`},

{id:"mi4",title:"Pronomi",icon:"🎯",
tip:{title:"Him, her, it, them",html:`<p>Object pronouns go <b>before</b> the verb in Italian: "I see him" = <b class=it>Lo vedo</b> (him I see).</p>
<table><tr><th>direct (who/what?)</th><th>indirect (to whom?)</th></tr>
<tr><td><b class=it>mi</b> me · <b class=it>ti</b> you · <b class=it>lo</b> him/it · <b class=it>la</b> her/it</td><td><b class=it>mi</b> to me · <b class=it>ti</b> to you · <b class=it>gli</b> to him · <b class=it>le</b> to her</td></tr>
<tr><td><b class=it>ci</b> us · <b class=it>vi</b> you all · <b class=it>li</b> them (m) · <b class=it>le</b> them (f)</td><td><b class=it>ci</b> to us · <b class=it>vi</b> to you all · <b class=it>gli</b> to them</td></tr></table>
<p>Two more super-useful ones: <b class=it>ne</b> = of it / of them (<i>Ne voglio due</i> — I want two of them) and <b class=it>ci</b> = there (<i>Ci vado domani</i> — I'm going there tomorrow).</p>
<p>With an infinitive, the pronoun sticks on the end: <b class=it>aiutarmi</b> (help me), <b class=it>vederlo</b> (see it). Same with commands: <b class=it>Dimmi!</b> (tell me), <b class=it>Aiutami!</b></p>
<p><b class=it>Lo so</b> — I know (it). <b class=it>Non lo so</b> — I don't know. You'll say this 40 times a day.</p>`},

{id:"mi5",title:"Imperfetto",icon:"🕰️",
tip:{title:"The 'used to / was doing' past",html:`<p>The <b>imperfetto</b> is for the past that <b>wasn't a single event</b>: habits (I used to…), descriptions (it was sunny, she was tall), background (I was eating when…), and feelings.</p>
<table><tr><th></th><th>-are: parlare</th><th>-ere: avere</th><th>-ire: dormire</th></tr>
<tr><td>io</td><td>parl<b class=it>avo</b></td><td>av<b class=it>evo</b></td><td>dorm<b class=it>ivo</b></td></tr><tr><td>tu</td><td>parl<b class=it>avi</b></td><td>av<b class=it>evi</b></td><td>dorm<b class=it>ivi</b></td></tr><tr><td>lui/lei</td><td>parl<b class=it>ava</b></td><td>av<b class=it>eva</b></td><td>dorm<b class=it>iva</b></td></tr>
<tr><td>noi</td><td>parl<b class=it>avamo</b></td><td>av<b class=it>evamo</b></td><td>dorm<b class=it>ivamo</b></td></tr><tr><td>voi</td><td>parl<b class=it>avate</b></td><td>av<b class=it>evate</b></td><td>dorm<b class=it>ivate</b></td></tr><tr><td>loro</td><td>parl<b class=it>avano</b></td><td>av<b class=it>evano</b></td><td>dorm<b class=it>ivano</b></td></tr></table>
<p>Only essere is truly irregular: <b class=it>ero, eri, era, eravamo, eravate, erano</b>. (Fare → facevo, dire → dicevo, bere → bevevo.)</p>
<p>Rule of thumb: <b>passato prossimo</b> = what happened; <b>imperfetto</b> = how things were. <i>Mentre <b>mangiavo</b>, <b>ha chiamato</b> Luca.</i></p>`},

{id:"mi6",title:"Corpo e salute",icon:"🩺",
tip:{title:"Ouch",html:`<p>"It hurts" works like <i>piace</i>: <b class=it>Mi fa male la testa</b> (my head hurts — literally "the head makes bad to me"). Plural: <b class=it>Mi fanno male i piedi.</b></p>
<p>Or use <b class=it>avere mal di</b>: <b class=it>ho mal di testa / di pancia / di gola</b>.</p>
<p>Body parts with odd plurals: <b class=it>il braccio → le braccia</b>, <b class=it>il dito → le dita</b>, <b class=it>la mano → le mani</b>, <b class=it>l'orecchio → le orecchie</b>, <b class=it>il ginocchio → le ginocchia</b>.</p>
<p>Sneeze? Someone says <b class=it>Salute!</b> The pharmacy has a green cross; the emergency number is <b>112</b>.</p>`},

{id:"sicilia",name:"Sicilia",sub:"Sentimenti e sole · Feelings and sunshine",emoji:"🍋",color:"#f4b400",dialect:"siciliano",lessons:[
{id:"si1",title:"Emozioni e carattere",icon:"😊",
tip:{title:"How do you feel?",html:`<p>Feelings use <b>essere</b> + adjective (agreeing with you): <b class=it>Sono felice. Sei arrabbiata? Siamo stanchi.</b></p>
<p>The big exceptions use <b>avere</b> (you learned them in Roma): ho paura, ho fame, ho sonno.</p>
<p>Italy's favourite exclamations: <b class=it>Mamma mia!</b> (wow / oh no), <b class=it>Che peccato!</b> (what a pity), <b class=it>Meno male!</b> (thank goodness), <b class=it>Boh</b> (dunno — with a shrug), <b class=it>Magari!</b> (I wish!).</p>`},

{id:"si2",title:"Natura e tempo",icon:"☀️",
tip:{title:"Weather talk",html:`<p><b class=it>Che tempo fa?</b> — what's the weather like? (<i>tempo</i> = weather AND time.)</p>

{id:"si3",title:"Futuro",icon:"🔮",
tip:{title:"Tomorrow and beyond",html:`<p>The future tense is one word. Take the infinitive, drop the final -e, and (for -are verbs) change the a to e:</p>
<table><tr><th></th><th>parlare → parler-</th><th>prendere → prender-</th><th>dormire → dormir-</th></tr>
<tr><td>io</td><td>parler<b class=it>ò</b></td><td>prender<b class=it>ò</b></td><td>dormir<b class=it>ò</b></td></tr><tr><td>tu</td><td>parler<b class=it>ai</b></td><td>prender<b class=it>ai</b></td><td>dormir<b class=it>ai</b></td></tr><tr><td>lui/lei</td><td>parler<b class=it>à</b></td><td>prender<b class=it>à</b></td><td>dormir<b class=it>à</b></td></tr>
<tr><td>noi</td><td>parler<b class=it>emo</b></td><td>prender<b class=it>emo</b></td><td>dormir<b class=it>emo</b></td></tr><tr><td>voi</td><td>parler<b class=it>ete</b></td><td>prender<b class=it>ete</b></td><td>dormir<b class=it>ete</b></td></tr><tr><td>loro</td><td>parler<b class=it>anno</b></td><td>prender<b class=it>anno</b></td><td>dormir<b class=it>anno</b></td></tr></table>
<p>Shortened stems: essere → <b class=it>sar-</b>, avere → <b class=it>avr-</b>, andare → <b class=it>andr-</b>, fare → <b class=it>far-</b>, potere → <b class=it>potr-</b>, volere → <b class=it>vorr-</b>, dovere → <b class=it>dovr-</b>, venire → <b class=it>verr-</b>, vedere → <b class=it>vedr-</b>, sapere → <b class=it>sapr-</b>.</p>
<p>Italians often use the present for near-future plans (<i>Domani vado a Roma</i>). The future is for promises, predictions and guesses: <b class=it>Sarà stanco</b> = he's probably tired.</p>`},
vocab:[["sarò","I will be"],["sarà","he will be|she will be|it will be"],["saremo","we will be"],["avrò","I will have"],["andrò","I will go"],["farò","I will do|I will make"],["potrò","I will be able to"],["vorrò","I will want"],["dovrò","I will have to"],["verrò","I will come"],["vedrò","I will see"],["mangerò","I will eat"],["partirò","I will leave"],["l'anno prossimo","next year"],["la settimana prossima","next week"],["tra un'ora","in an hour"],["un giorno","one day|someday"],["il futuro","future"],["il sogno","dream"],["sognare","to dream"],["promettere","to promise"],["sperare","to hope"],["spero di sì","I hope so"],["vedremo","we'll see"],["chissà","who knows"],["sicuramente","surely|definitely"],["probabilmente","probably"],["succedere","to happen"],["perfettamente","perfectly"],["prossimo","next"]],

{id:"si4",title:"Condizionale",icon:"🤔",
tip:{title:"Would, could, should",html:`<p>Same stems as the future, different endings:</p>
<table><tr><td>io</td><td>parler<b class=it>ei</b></td><td>noi</td><td>parler<b class=it>emmo</b></td></tr><tr><td>tu</td><td>parler<b class=it>esti</b></td><td>voi</td><td>parler<b class=it>este</b></td></tr><tr><td>lui/lei</td><td>parler<b class=it>ebbe</b></td><td>loro</td><td>parler<b class=it>ebbero</b></td></tr></table>
<p>The three you'll use most:</p><ul><li><b class=it>vorrei</b> — I'd like (volere)</li><li><b class=it>potrei / potresti</b> — I could / could you? (potere)</li><li><b class=it>dovrei / dovresti</b> — I should / you should (dovere)</li></ul>
<p><b class=it>Mi piacerebbe</b> = I would like (it would please me). <b class=it>Sarebbe bello</b> = it would be nice.</p>
<p>Careful: noi future is <i>-emo</i> (one m), noi conditional is <i>-emmo</i> (two). <i>Parleremo</i> = we will speak; <i>parleremmo</i> = we would speak.</p>`},

{id:"si5",title:"Imperativo",icon:"📣",
tip:{title:"Commands (and being bossy nicely)",html:`<p>Telling a friend (<b>tu</b>) what to do:</p><ul><li>-are verbs end in <b class=it>-a</b>: <b class=it>Guarda! Aspetta! Mangia!</b></li><li>-ere / -ire verbs end in <b class=it>-i</b>: <b class=it>Prendi! Senti! Apri!</b></li><li>Negative: <b class=it>non</b> + infinitive: <b class=it>Non toccare! Non correre!</b></li></ul>
<p>Formal (<b>Lei</b>) flips the vowel: <b class=it>Guardi. Prenda. Senta.</b> Group commands (<b>noi</b>) = "let's": <b class=it>Andiamo! Mangiamo!</b></p>
<p>Five short irregular ones: <b class=it>va'</b> (go), <b class=it>fa'</b> (do), <b class=it>da'</b> (give), <b class=it>sta'</b> (stay), <b class=it>di'</b> (say). Pronouns double up on them: <b class=it>dimmi</b> (tell me), <b class=it>fammi vedere</b> (let me see), <b class=it>dammi</b> (give me).</p>
<p>Good luck is <b class=it>In bocca al lupo!</b> — "into the wolf's mouth". The only correct reply: <b class=it>Crepi!</b> (may it die).</p>`},

{id:"si6",title:"Animali",icon:"🐾",
tip:{title:"Creatures",html:`<p>Animals are everywhere in Italian idioms. <b class=it>In bocca al lupo</b> (good luck), <b class=it>essere un coniglio</b> (to be a chicken — literally a rabbit), <b class=it>una gatta da pelare</b> (a tough job — a cat to skin), <b class=it>sano come un pesce</b> (healthy as a fish).</p>
<p>Italian animals make different sounds: dogs say <b class=it>bau bau</b>, cats <b class=it>miao</b>, roosters <b class=it>chicchirichì</b>, pigs <b class=it>oink</b> (ok, same).</p>`},

{id:"sa1",title:"Congiuntivo presente",icon:"🎭",
tip:{title:"The subjunctive: opinions, hopes, wishes",html:`<p>After verbs of <b>thinking, hoping, wanting, doubting</b> + <b class=it>che</b>, Italian switches to the subjunctive. It marks "this is my view, not a fact".</p>
<p><b class=it>Penso che Marco <b>sia</b> stanco.</b> (I think Marco is tired) · <b class=it>Spero che tu <b>venga</b>.</b> (I hope you come) · <b class=it>Voglio che <b>parli</b> italiano.</b></p>
<table><tr><th></th><th>-are: parlare</th><th>-ere/-ire: prendere</th><th>-isc: finire</th></tr>
<tr><td>io / tu / lui</td><td>parl<b class=it>i</b></td><td>prend<b class=it>a</b></td><td>fin<b class=it>isca</b></td></tr><tr><td>noi</td><td>parl<b class=it>iamo</b></td><td>prend<b class=it>iamo</b></td><td>fin<b class=it>iamo</b></td></tr><tr><td>voi</td><td>parl<b class=it>iate</b></td><td>prend<b class=it>iate</b></td><td>fin<b class=it>iate</b></td></tr><tr><td>loro</td><td>parl<b class=it>ino</b></td><td>prend<b class=it>ano</b></td><td>fin<b class=it>iscano</b></td></tr></table>
<p>Io, tu and lui are identical, so Italians add the pronoun: <i>che <b>tu</b> parli</i>.</p>
<p>Irregulars: essere → <b class=it>sia</b>, avere → <b class=it>abbia</b>, andare → <b class=it>vada</b>, fare → <b class=it>faccia</b>, potere → <b class=it>possa</b>, volere → <b class=it>voglia</b>, dovere → <b class=it>debba</b>, venire → <b class=it>venga</b>, dire → <b class=it>dica</b>, stare → <b class=it>stia</b>, dare → <b class=it>dia</b>, sapere → <b class=it>sappia</b>.</p>
<p>Triggers: penso che, credo che, spero che, voglio che, è importante che, è possibile che, bisogna che, benché, sebbene, prima che, affinché, sembra che.</p>`},
vocab:[["penso che","I think that"],["credo che","I believe that|I think that"],["spero che","I hope that"],["voglio che","I want (someone) to"],["è importante che","it's important that"],["è possibile che","it's possible that"],["bisogna che","it's necessary that|one must"],["benché","although|even though"],["sebbene","although"],["affinché","so that|in order that"],["prima che","before"],["senza che","without"],["sembra che","it seems that"],["è meglio che","it's better that"],["purché","provided that|as long as"],["che sia","that he is|that she is|that it is"],["che abbia","that he has|that she has"],["che vada","that he goes|that she goes"],["che faccia","that he does|that she does"],["che possa","that he can|that she can"],["che venga","that he comes|that she comes"],["che dica","that he says|that she says"],["che parli","that he speaks|that you speak"],["che mangi","that he eats|that you eat"],["che finisca","that he finishes|that you finish"],["che tu sia","that you are"],["che voi siate","that you all are"],["che loro siano","that they are"],["l'idea","idea"],["la ragione","reason"],["avere ragione","to be right"],["dubitare","to doubt"]],

{id:"sa2",title:"Ipotesi e sogni",icon:"🌈",
tip:{title:"If I were rich…",html:`<p>Dreams and what-ifs use <b>se</b> + <b>congiuntivo imperfetto</b>, then the <b>condizionale</b>:</p>
<p><b class=it>Se <b>avessi</b> tempo, <b>viaggerei</b>.</b> — If I had time, I would travel.<br><b class=it>Se <b>fossi</b> ricca, <b>comprerei</b> una casa al mare.</b></p>
<table><tr><th></th><th>-are: parlare</th><th>-ere: avere</th><th>-ire: dormire</th></tr>
<tr><td>io / tu</td><td>parl<b class=it>assi</b></td><td>av<b class=it>essi</b></td><td>dorm<b class=it>issi</b></td></tr><tr><td>lui/lei</td><td>parl<b class=it>asse</b></td><td>av<b class=it>esse</b></td><td>dorm<b class=it>isse</b></td></tr><tr><td>noi</td><td>parl<b class=it>assimo</b></td><td>av<b class=it>essimo</b></td><td>dorm<b class=it>issimo</b></td></tr><tr><td>voi</td><td>parl<b class=it>aste</b></td><td>av<b class=it>este</b></td><td>dorm<b class=it>iste</b></td></tr><tr><td>loro</td><td>parl<b class=it>assero</b></td><td>av<b class=it>essero</b></td><td>dorm<b class=it>issero</b></td></tr></table>
<p>Essere: <b class=it>fossi, fossi, fosse, fossimo, foste, fossero</b>. Fare: <b class=it>facessi</b>. Dire: <b class=it>dicessi</b>. Stare: <b class=it>stessi</b>. Dare: <b class=it>dessi</b>.</p>
<p>Also after past-tense opinions: <b class=it>Pensavo che <b>fosse</b> facile.</b> And wishes: <b class=it>Vorrei che tu <b>fossi</b> qui.</b> · <b class=it>Magari <b>fosse</b> vero!</b></p>`},

{id:"sa3",title:"Passato remoto e storia",icon:"📜",
tip:{title:"The storybook past",html:`<p>The <b>passato remoto</b> is the past of novels, history books and fairy tales — and of everyday speech in the South (Sicilians use it for last week!). In the North people stick to the passato prossimo. You mainly need to <b>recognise</b> it.</p>
<table><tr><th></th><th>-are: parlare</th><th>-ere: credere</th><th>-ire: dormire</th></tr>
<tr><td>io</td><td>parl<b class=it>ai</b></td><td>cred<b class=it>ei</b></td><td>dorm<b class=it>ii</b></td></tr><tr><td>tu</td><td>parl<b class=it>asti</b></td><td>cred<b class=it>esti</b></td><td>dorm<b class=it>isti</b></td></tr><tr><td>lui/lei</td><td>parl<b class=it>ò</b></td><td>cred<b class=it>é</b></td><td>dorm<b class=it>ì</b></td></tr>
<tr><td>noi</td><td>parl<b class=it>ammo</b></td><td>cred<b class=it>emmo</b></td><td>dorm<b class=it>immo</b></td></tr><tr><td>voi</td><td>parl<b class=it>aste</b></td><td>cred<b class=it>este</b></td><td>dorm<b class=it>iste</b></td></tr><tr><td>loro</td><td>parl<b class=it>arono</b></td><td>cred<b class=it>erono</b></td><td>dorm<b class=it>irono</b></td></tr></table>
<p>The famous irregulars: essere → <b class=it>fui, fosti, fu, fummo, foste, furono</b> · avere → <b class=it>ebbi… ebbe… ebbero</b> · fare → <b class=it>feci… fece… fecero</b> · dire → <b class=it>disse</b> · nascere → <b class=it>nacque</b> · vedere → <b class=it>vide</b> · venire → <b class=it>venne</b> · scrivere → <b class=it>scrisse</b>.</p>`},

{id:"sa4",title:"Parlare come un italiano",icon:"🧩",
tip:{title:"The glue words that make you sound real",html:`<p>Native speech is full of little connectors. Learn these and your Italian stops sounding like a textbook:</p>
<ul><li><b class=it>Allora…</b> — so / well then (start of any sentence)</li><li><b class=it>Quindi</b> — so, therefore · <b class=it>Perché</b> — because / why</li><li><b class=it>Però</b> — but (stronger than ma) · <b class=it>Comunque</b> — anyway</li><li><b class=it>Cioè</b> — I mean, that is · <b class=it>Insomma</b> — in short, well…</li><li><b class=it>Infatti</b> — indeed, exactly · <b class=it>Anzi</b> — actually, on the contrary</li><li><b class=it>Magari</b> — maybe / I wish · <b class=it>Mica</b> — not at all (<i>Non è mica facile!</i>)</li><li><b class=it>Vabbè</b> — oh well, fine · <b class=it>Boh</b> — dunno · <b class=it>Tipo</b> — like (teen slang)</li></ul>`},

{id:"sa5",title:"Modi di dire",icon:"🎭",
tip:{title:"Idioms Italians actually use",html:`<p>You can't translate these word for word — that's the fun.</p>
<ul><li><b class=it>Non vedo l'ora</b> — I can't wait (I don't see the hour)</li><li><b class=it>Essere al verde</b> — to be broke (to be in the green)</li><li><b class=it>Costa un occhio della testa</b> — costs an arm and a leg (an eye from your head)</li><li><b class=it>Acqua in bocca!</b> — keep it secret (water in your mouth)</li><li><b class=it>Essere un pezzo di pane</b> — to be a sweetheart (a piece of bread)</li><li><b class=it>Fare una figuraccia</b> — to make a fool of yourself; <b class=it>fare bella figura</b> — to make a good impression. Italians live by this one.</li><li><b class=it>Il dolce far niente</b> — the sweetness of doing nothing</li></ul>`},

function vinfo(inf){
  const refl=/rsi$/.test(inf); const base=refl?inf.slice(0,-2)+"e":inf;
  const V=VERBS[inf]||VERBS[base]||{};
  const type=V.isc?"isc":base.endsWith("are")?"are":base.endsWith("ere")?"ere":"ire";
  return {refl,base,V,type,stem:base.slice(0,-3)};
}
function jn(stem,end,type){
  if(end==null)return null;
  if(type==="are"&&/[cg]$/.test(stem)&&/^[ie]/.test(end))return stem+"h"+end;
  if(/i$/.test(stem)&&/^i/.test(end))return stem.slice(0,-1)+end;
  return stem+end;
}
function futStem(stem,type){
  if(type==="are"){ if(/[cg]$/.test(stem))return stem+"her"; if(/[cg]i$/.test(stem))return stem.slice(0,-1)+"er"; return stem+"er"; }
  if(type==="ere")return stem+"er"; return stem+"ir";
}
function conj(inf,tense,p){
  const {refl,base,V,type,stem}=vinfo(inf); const t3=type==="isc"?"ire":type; let f=null;
  switch(tense){
    case "presente": f=V.pres?V.pres[p]:jn(stem,E.pres[type][p],type); break;
    case "imperfetto": f=V.imp?V.imp[p]:stem+E.imp[t3][p]; break;
    case "futuro": f=(V.fut||futStem(stem,type))+E.fut[p]; break;
    case "condizionale": f=(V.fut||futStem(stem,type))+E.cond[p]; break;
    case "congiuntivo": f=V.cong?V.cong[p]:jn(stem,E.cong[type][p],type); break;
    case "congimp": f=V.congimp?V.congimp[p]:stem+E.congimp[t3][p]; break;
    case "imperativo": if(p===0||V.noimper)return null; f=V.imper?V.imper[p]:jn(stem,E.imper[type][p],type); break;
    case "remoto": f=V.rem?V.rem[p]:stem+E.rem[t3][p]; break;
    case "passato": { const aux=(refl||V.aux==="essere")?"essere":"avere"; const pp=V.pp||stem+({are:"ato",ere:"uto",ire:"ito",isc:"ito"}[type]); const ppf=aux==="essere"?(p<3?pp.slice(0,-1)+"o/a":pp.slice(0,-1)+"i/e"):pp; f=VERBS[aux].pres[p]+" "+ppf; break; }
  }
  if(f==null)return null;
  if(refl){ const pr=["mi","ti","si","ci","vi","si"][p];
    if(tense==="imperativo"){ const suf=[null,"ti",null,"ci","vi",null][p]; f=suf?f.split("|").map(x=>x+suf).join("|"):"si "+f; }
    else f=pr+" "+f; }
  return f;

noiese:{name:"Noiese (Noepoli)",city:"Noepoli · Val Sarmento · Basilicata",emoji:"❤️",family:true,
intro:`<p><b>Noepoli</b> — <i>Noja</i> in the old days, <i>Noèpol</i> in dialect — is a village of about 700 people, 676 m up in the Val Sarmento inside the Pollino National Park, on Basilicata's border with Calabria. Its people are the <b>nojesi</b>. Greek Basilian monks ran a school here in the Middle Ages, and the name still means "new city" in Greek.</p>
<p>Linguists know this corner as the <b>area Lausberg</b>: its vowels work like Sardinian, which makes it one of the most archaic dialects on the Italian mainland — the closest thing to spoken Latin south of Rome. Tomorrow is still <i>crai</i>, straight from Latin <i>cras</i>.</p>
<p><b>What to listen for:</b> final vowels fade into a soft mumble (written <b>ë</b>, said like the <i>a</i> in "sofa"); Latin <i>ll</i> turns into <b>dd</b> (<i>iddu</i> = he, <i>gaddrina</i> = hen); "the" is just <b>u / a / i</b>; "to have" does the work of "to be" (<i>si aggh' vinuto</i> = I came); and the storybook past tense is used for what happened this morning.</p>
<p><b>Village life:</b> on 8 December the men go cellar to cellar for <i>spinoa vutt</i>, tapping the new wine with rhymed toasts; on 13 December every house cooks <i>cuccìa</i> for Santa Lucia; in winter <i>amë accisë u puurchë</i> — the pig is killed and becomes <i>savëzizz'</i>. The patron is the Madonna di Costantinopoli (6 August), and the Madonna del Rosario is carried through town on 20–21 October. Two villages over, San Costantino and San Paolo Albanese still speak Albanian. Many nojesi left for America a century ago; some died in the Monongah mine disaster in West Virginia in 1907.</p>
<p class="note">Honesty note: very little of Noepoli's dialect has ever been written down. Phrases marked 🏠 are documented in Noepoli itself; 🏔️ come from the same valley (San Severino Lucano, Senise, Lauria) and will be very close; 📜 are Lucanian proverbs. The real authority is your girlfriend's family — every village says things its own way. Put what they actually say in the <b>Family notebook</b>.</p>`,

const NU=["zero","uno","due","tre","quattro","cinque","sei","sette","otto","nove","dieci","undici","dodici","tredici","quattordici","quindici","sedici","diciassette","diciotto","diciannove"];
const NT=["","","venti","trenta","quaranta","cinquanta","sessanta","settanta","ottanta","novanta"];
function numIt(n){if(n<20)return NU[n];if(n<100){const t=Math.floor(n/10),u=n%10;let s=NT[t];if(!u)return s;if(u===1||u===8)s=s.slice(0,-1);if(u===3)return s+"tré";return s+NU[u]}
  if(n<1000){const h=Math.floor(n/100),r=n%100;let s=h===1?"cento":NU[h]+"cento";if(!r)return s;if(r===8||(r>=80&&r<90))s=s.slice(0,-1);return s+numIt(r)}
  const k=Math.floor(n/1000),r=n%1000;const s=k===1?"mille":numIt(k)+"mila";return r?s+numIt(r):s}
function hourIt(h){const x=h%12;if(h%24===0)return["è mezzanotte","sono le dodici"];if(h===12)return["è mezzogiorno","sono le dodici"];if(x===1)return["è l'una"];return["sono le "+numIt(x)]}
function timeIt(h,m){const cur=hourIt(h),nxt=hourIt(h+1);const out=[];
  if(m===0){cur.forEach(s=>out.push(s));cur.forEach(s=>out.push(s+" in punto"))}
  else if(m===15)cur.forEach(s=>{out.push(s+" e un quarto");out.push(s+" e quindici")});
  else if(m===30)cur.forEach(s=>{out.push(s+" e mezza");out.push(s+" e mezzo");out.push(s+" e trenta")});
  else if(m===45){nxt.forEach(s=>out.push(s+" meno un quarto"));cur.forEach(s=>out.push(s+" e quarantacinque"))}
  else if(m>30){nxt.forEach(s=>out.push(s+" meno "+numIt(60-m)));cur.forEach(s=>out.push(s+" e "+numIt(m)))}
  else cur.forEach(s=>out.push(s+" e "+numIt(m)));return out}

    w.lessons.forEach((l,i)=>{const st=S.done[l.id]||0;const un=lessonOpen(l);const isNext=next&&next.id===l.id;const off=[0,44,0,-44][i%4];
      html+='<div class="nodewrap" style="transform:translateX('+off+'px)"><button class="node'+(l.boss?" boss":"")+(!un?" locked":st?" done":"")+(isNext?" next":"")+'" style="--wc:'+w.color+'" onclick="tapNode(\''+l.id+'\')">'+(st===3?'<span class="crown">👑</span>':"")+(un?l.icon:"🔒")+'</button><div class="nlabel">'+esc(l.title)+'</div><div class="stars">'+(st?"★".repeat(st)+"☆".repeat(3-st):"&nbsp;")+"</div></div>"});html+="</div>"});
  $("#s-home .wrap").innerHTML=html}
function tapNode(id){const l=LESSONS[id];if(!lessonOpen(l)){toast(l.dialect?"Beat the regional challenge to unlock the dialect":l.boss?"Finish all the lessons in this region first":"Finish the previous lesson first");sfx("bad");return}const st=S.done[id]||0;
  modal("<h2>"+l.icon+" "+esc(l.title)+'</h2><p class="muted">'+(l.boss?"About 20 mixed questions from the whole region, only 3 hearts. Win it to unlock the next region and the local dialect.":l.dialect?"Street talk from "+esc(DIALECTS[l.dialect].city)+". Learn how locals really speak.":(l.vocab?l.vocab.length+" words · ":"")+(l.tip?"grammar tip · ":"")+(l.drills?"grammar drills · ":"")+"about 15 exercises")+"</p>"+(st?"<p>Best: "+"★".repeat(st)+"☆".repeat(3-st)+" — play again for XP and to strengthen the words.</p>":"")+'<button class="btn wide big" onclick="closeModal();startLesson(\''+id+"')\">"+(st?"Play again":"Inizia!")+"</button>"+(l.tip?'<br><br><button class="btn ghost wide" onclick="closeModal();showTip(\''+id+"')\">📖 Read the grammar tip first</button>":""))}

function conjTable(v){const info=vinfo(v);const aux=(info.refl||info.V.aux==="essere")?"essere":"avere";let h='<div class="muted small" style="margin:6px 0">'+(info.type==="isc"?"-ire verb with -isc-":"-"+info.type+" verb")+(info.refl?" · reflexive":"")+" · past with <b>"+aux+"</b>"+(info.V.pp?" · participle <b>"+info.V.pp+"</b>":"")+"</div>";
  Object.entries(TENSES).forEach(([k,name])=>{const rows=[];for(let p=0;p<6;p++){const f=conj(v,k,p);if(f==null)continue;rows.push("<tr><td>"+(k==="imperativo"?SUBJ_IMP[p]:SUBJ[p])+"</td><td>"+esc(f.replace("|"," / "))+"</td></tr>")}if(rows.length)h+="<h3>"+name+' <button class="spk sm" data-say="'+esc(conj(v,k,2)||conj(v,k,1)||"")+'">🔊</button></h3><table class="cj">'+rows.join("")+"</table>"});return h}
function pbFilter(){const q=strip(norm($("#pb-q").value||""));let items=dedupe(ALLVOCAB);if(q)items=items.filter(v=>strip(norm(v.it)).includes(q)||strip(norm(v.en)).includes(q));const sents=q?ALLSENT.filter(s=>strip(norm(s.it)).includes(q)||strip(norm(s.en)).includes(q)):[];
  const html=items.slice(0,150).map(v=>{const r=S.srs[v.it];return '<div class="wrow">'+spk(v.it,"sm")+'<div class="grow"><div class="it">'+esc(v.it)+'</div><div class="en">'+esc(v.en.split("|").join(" · "))+(v.note?' <span class="muted">— '+esc(v.note)+"</span>":"")+'</div></div><div class="str">'+[1,2,3,4,5].map(i=>'<i class="'+(r&&r.s>=i?"on":"")+'"></i>').join("")+"</div></div>"}).join("")+sents.slice(0,60).map(s=>'<div class="wrow">'+spk(s.it,"sm")+'<div class="grow"><div class="it">'+esc(s.it)+'</div><div class="en">'+esc(s.en)+"</div></div></div>").join("");
  $("#pb-list").innerHTML=(html||'<p class="muted">Nothing found.</p>')+(items.length>150?'<p class="muted small">Showing the first 150 of '+items.length+" — type to narrow down.</p>":'<p class="muted small">'+items.length+" words"+(sents.length?", "+sents.length+" sentences":"")+"</p>")}
function renderDialects(){const sel=S.ui_dial;if(sel&&DIALECTS[sel]){const D=DIALECTS[sel];$("#s-dialects .wrap").innerHTML='<button class="btn ghost sm" onclick="S.ui_dial=null;renderDialects()">← All dialects</button><h1 style="margin-top:12px">'+D.emoji+" "+esc(D.name)+'</h1><div class="muted">'+esc(D.city)+'</div><div class="card tip">'+D.intro+'</div><button class="btn wide" onclick="dialectPractice(\''+sel+'\')">🎮 Quiz me on '+esc(D.name)+"</button>"+D.phrases.map(p=>'<div class="dial">'+spk(p[0],"sm")+'<div class="grow"><div class="d">'+esc(p[0])+'</div><div class="s">'+esc(p[1])+'</div><div class="e">'+esc(p[2])+(p[3]?" · <i>"+esc(p[3])+"</i>":"")+"</div></div></div>").join("");return}
  $("#s-dialects .wrap").innerHTML='<h1>🗣️ Dialects</h1><p class="muted">Italy has dozens of dialects and regional languages. Here are seven big ones. Browse freely — the map also unlocks a dialect lesson each time you beat a region.</p>'+Object.entries(DIALECTS).map(([k,D])=>'<button class="pcard" style="width:100%;margin-bottom:10px;display:flex;gap:14px;align-items:center" onclick="S.ui_dial=\''+k+'\';renderDialects()"><i style="margin:0">'+D.emoji+"</i><div><b>"+esc(D.name)+(S.dialects[k]?" ✅":"")+"</b><span>"+esc(D.city)+" · "+D.phrases.length+" phrases</span></div></button>").join("")}
const sw=(k,l)=>'<label class="sw">'+l+'<input type="checkbox"'+(S.settings[k]?" checked":"")+' onchange="S.settings[\''+k+"']=this.checked;save();renderAll()\"></label>";
function renderMeBase(){const lv=level(S.xp),lo=60*(lv-1)*(lv-1),hi=60*lv*lv;const tot=S.stats.correct+S.stats.wrong;const acc=tot?Math.round(S.stats.correct/tot*100):0;const st=S.settings;

  "<h2>🏅 Badges</h2>"+BADGES.map(b=>'<div class="badge'+(S.badges.includes(b[0])?"":" off")+'"><i>'+b[1]+"</i><div><b>"+b[2]+'</b><div class="muted small">'+b[3]+"</div></div></div>").join("")+
  '<h2>⚙️ Settings</h2><div class="card">'+sw("sound","🔔 Sound effects")+sw("auto","🔊 Auto-play Italian audio")+sw("strict","🎯 Strict accents (è must be è)")+sw("unlockAll","🔓 Unlock every lesson (free roam)")+'<label class="sw">🎚️ Voice speed <input type="range" min="0.5" max="1.2" step="0.05" value="'+st.rate+'" onchange="S.settings.rate=+this.value;save();say(\'Ciao, come stai?\')"></label><label class="sw">🗣️ Italian voice <select onchange="S.settings.voice=this.value;save();say(\'Buongiorno! Io sono la tua voce.\')"><option value="">Default</option>'+VOICES.map(v=>'<option value="'+esc(v.name)+'"'+(st.voice===v.name?" selected":"")+">"+esc(v.name)+"</option>").join("")+'</select></label><label class="sw">🎯 Daily goal (XP) <select onchange="S.goal=+this.value;save();renderAll()">'+[20,50,100,200].map(g=>"<option"+(S.goal===g?" selected":"")+">"+g+"</option>").join("")+'</select></label><label class="sw">🌗 Theme <select onchange="S.settings.theme=this.value;save();applyTheme()">'+["auto","light","dark"].map(t=>"<option"+(st.theme===t?" selected":"")+">"+t+"</option>").join("")+"</select></label>"+(VOICES.length?"":'<div class="note" style="margin-top:8px">No Italian voice found on this device yet. On Windows: Settings → Time & Language → Language → add Italian (with speech). On iPhone and Mac it\'s built in. Chrome and Edge also bring their own.</div>')+"</div>"+
  '<h2>💾 Backup</h2><div class="card"><p class="muted small">Progress lives in this browser. To move it to your phone or another computer, copy the code here and paste it there.</p><div class="row"><button class="btn sm blue" onclick="exportProg()">Copy backup code</button><button class="btn sm ghost" onclick="importProg()">Restore from code</button></div><textarea id="bk" class="ans" style="margin-top:10px;font-size:12px;height:70px" placeholder="Backup code appears here — or paste one here"></textarea></div><div class="card"><button class="btn red sm" onclick="resetAll()">Reset all progress</button></div><p class="center muted small">Bravissimo · 7 regions · '+dedupe(ALLVOCAB).length+" words · "+ALLSENT.length+" sentences · "+Object.keys(VERBS).length+" verbs · "+Object.keys(DIALECTS).length+" dialects</p>"}
function exportProg(){const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));$("#bk").value=code;$("#bk").select();try{navigator.clipboard.writeText(code).then(()=>toast("Copied!"),()=>toast("Select the code and copy it"))}catch(e){toast("Select the code and copy it")}}

/* ===================== FAMILY NOTEBOOK (Parole di famiglia) ===================== */
if(!Array.isArray(S.family))S.family=[];
function saveStrict(){localStorage.setItem(KEY,JSON.stringify(S))}
function famAdd(){const d=$("#fm-d").value.trim(),en=$("#fm-en").value.trim(),it=$("#fm-it").value.trim(),who=$("#fm-who").value.trim();if(!d||!en){toast("Need at least the phrase and what it means");return}S.family.push({d,en,it,who,added:todayKey()});try{saveStrict();sfx("ok");toast("Saved to the family notebook")}catch(e){S.family.pop();toast("Out of storage space — delete a recording or two")}renderDialects()}
function famDel(i){modal('<h2>Delete this phrase?</h2><p class="muted">'+esc(S.family[i].d)+'</p><div class="row"><button class="btn red grow" onclick="S.family.splice('+i+',1);save();closeModal();renderDialects()">Delete</button><button class="btn ghost grow" onclick="closeModal()">Keep</button></div>')}
function famEdit(i){const f=S.family[i];modal('<h2>Edit phrase</h2>'+famForm(f)+'<button class="btn wide" onclick="famSaveEdit('+i+')">Save</button>')}
function famSaveEdit(i){const f=S.family[i];f.d=$("#fm-d").value.trim()||f.d;f.en=$("#fm-en").value.trim()||f.en;f.it=$("#fm-it").value.trim();f.who=$("#fm-who").value.trim();save();closeModal();renderDialects()}
function famForm(f){f=f||{};return '<label>What they say (dialect)<br><input type="text" id="fm-d" value="'+esc(f.d||"")+'" placeholder="e.g. Amë accisë u puurchë" style="width:100%"></label><br><br><label>What it means (English)<br><input type="text" id="fm-en" value="'+esc(f.en||"")+'" placeholder="We killed the pig" style="width:100%"></label><br><br><label>In standard Italian <span class="muted small">(optional)</span><br><input type="text" id="fm-it" value="'+esc(f.it||"")+'" placeholder="Abbiamo ucciso il maiale" style="width:100%"></label><br><br><label>Who says it / when <span class="muted small">(optional)</span><br><input type="text" id="fm-who" value="'+esc(f.who||"")+'" placeholder="Nonna, every Sunday lunch" style="width:100%"></label><br><br>'}
function famPlay(i){const f=S.family[i];if(f.audio){try{new Audio(f.audio).play()}catch(e){say(f.d)}}else say(f.d)}
let REC=null;
async function famRecord(i){if(REC){REC.stop();return}if(!navigator.mediaDevices||!window.MediaRecorder){toast("Recording isn't supported in this browser");return}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true});const mr=new MediaRecorder(st);const chunks=[];mr.ondataavailable=e=>chunks.push(e.data);
    mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());REC=null;const b=new Blob(chunks,{type:mr.mimeType});if(b.size>600000){toast("Clip too long — keep it under 8 seconds");renderDialects();return}const r=new FileReader();r.onload=()=>{const prev=S.family[i].audio;S.family[i].audio=r.result;try{saveStrict();sfx("ok");toast("Recording saved 🎙️")}catch(e){S.family[i].audio=prev;toast("Out of storage space for audio — delete an old recording")}renderDialects()};r.readAsDataURL(b)};
    mr.start();REC=mr;renderDialects();setTimeout(()=>{if(REC===mr&&mr.state==="recording")mr.stop()},8000)}catch(e){toast("Microphone blocked or unavailable")}}
function famDelAudio(i){delete S.family[i].audio;save();renderDialects()}
function famQuiz(){const F=S.family;if(F.length<4){toast("Add at least 4 family phrases first");return}const P=F.map((f,i)=>({d:f.d,s:f.it||f.en,e:f.en,n:f.who?"from "+f.who:"",i}));const ex=[];
  pick(P,Math.min(6,P.length)).forEach(p=>ex.push(dchoose(p,P,"en")));pick(P,Math.min(4,P.length)).forEach(p=>ex.push(dchoose(p,P,"rev")));
  pick(P,Math.min(3,P.length)).forEach(p=>ex.push({t:"type",key:"",prompt:"How does the family say: “"+p.e+"”?",sub:p.n,answers:[p.d],soft:[],show:p.d,explain:p.s!==p.e?p.s:""}));
  if(P.length>=5)ex.push({t:"match",pairs:pick(P,5).map(p=>[p.d,p.e]),keys:[]});
  startLesson("custom",{custom:shuffle(ex),title:"Parole di famiglia",mode:"practice"})}
